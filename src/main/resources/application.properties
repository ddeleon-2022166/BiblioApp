spring.application.name=BiblioApp

# Configuración PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_biblio_app
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad JWT Config (Mínimo 256 bits para HS256)
application.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000

# Configuraciones de Negocio Centralizadas
biblioteca.prestamo.dias-limite=14
biblioteca.prestamo.limite-activos-lector=3

# Puerto
server.port=8081

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true